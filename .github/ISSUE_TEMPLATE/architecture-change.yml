name: Architecture change
description: Propose a change to system architecture or a platform standard
title: "[Architecture]: "
labels: ["architecture"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and context
      description: What problem does this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Alternatives and trade-offs
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, privacy and tenant impact
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: Compatibility, migration and rollback
    validations:
      required: true

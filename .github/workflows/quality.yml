name: Quality baseline

on:
  pull_request:
    branches: [main, "scaffold/**", "architecture/**", "foundation/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Whitespace checks
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}"..."${{ github.sha }}"
      - name: Added-line merge conflict marker check
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --no-ext-diff --unified=0 "${{ github.event.pull_request.base.sha }}"..."${{ github.sha }}" | grep -E '^\+(<<<<<<< |=======$|>>>>>>> )'; then
            echo "Possible merge conflict markers found in changed lines."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verification
        run: mvn -B -ntp verify
